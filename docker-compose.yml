services:
  db:
    image: postgres:15
    container_name: flipped_db
    environment:
      - POSTGRES_DB=flipped_local
      - POSTGRES_USER=flipped_admin
      - POSTGRES_PASSWORD=flipped_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: